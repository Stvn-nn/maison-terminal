# Builds the Maison Terminal Windows installer (NSIS) on a GitHub-hosted Windows runner,
# which has the Microsoft C++ build tools that Tauri needs. Run it from the Actions tab
# ("Run workflow") or by pushing desktop changes to the feature branch.
name: Desktop installer (Windows)

on:
  workflow_dispatch:
  push:
    branches: [feature/frontend-ui]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/desktop-installer.yml"

permissions:
  contents: read

concurrency:
  group: desktop-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Build the installer
        run: npm run tauri build

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: maison-terminal-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
