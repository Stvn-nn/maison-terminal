# Builds the self-contained Maison Terminal Windows installer on a GitHub-hosted Windows runner
# (which has the Microsoft C++ build tools Tauri needs):
#   1. test and package python-core into a standalone engine (PyInstaller)
#   2. smoke-test the packaged engine over HTTP
#   3. build the Tauri NSIS installer with the engine bundled as a resource
# Run it from the Actions tab ("Run workflow"), or push desktop/engine changes.
name: Desktop installer (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "python-core/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/desktop-installer.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "python-core/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/desktop-installer.yml"

permissions:
  contents: read

concurrency:
  group: desktop-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-core/requirements*.txt

      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal; rustup default stable

      - name: Install engine dependencies and PyInstaller
        run: python -m pip install -r python-core/requirements-dev.txt pyinstaller

      - name: Engine tests
        working-directory: python-core
        run: python -m pytest -q

      - name: Package the engine
        run: ./scripts/build-engine.ps1

      - name: Smoke-test the packaged engine
        run: |
          $engineExecutable = Resolve-Path "engine-build/dist/maison-core/maison-core.exe"
          $standardOutputLog = Join-Path $env:RUNNER_TEMP "engine-stdout.log"
          $standardErrorLog = Join-Path $env:RUNNER_TEMP "engine-stderr.log"
          $engineProcess = Start-Process -FilePath $engineExecutable -WorkingDirectory $env:RUNNER_TEMP `
            -PassThru -RedirectStandardOutput $standardOutputLog -RedirectStandardError $standardErrorLog
          try {
            $health = $null
            $startupClock = [System.Diagnostics.Stopwatch]::StartNew()
            for ($attempt = 1; $attempt -le 90 -and $null -eq $health; $attempt++) {
              try { $health = Invoke-RestMethod -Uri "http://127.0.0.1:8000/health" -TimeoutSec 2 }
              catch { Start-Sleep -Seconds 1 }
            }
            if ($null -eq $health -or $health.service -ne "maison-terminal-core") {
              throw "Packaged engine did not become healthy"
            }
            $catalog = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/v1/indicators" -TimeoutSec 30
            if ($catalog.count -lt 100) { throw "Indicator catalog too small: $($catalog.count)" }
            $sizing = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/api/v1/sizing/calculate" `
              -ContentType "application/json" `
              -Body '{"mode":"risk_to_stop","entry_price":100,"stop_price":98,"account_equity":50000,"risk_pct":1}'
            if ($sizing.shares -ne 250) { throw "Unexpected sizing result: $($sizing.shares)" }
            Write-Host ("Packaged engine healthy after {0:N1}s: {1} indicators, sizing OK" -f `
              $startupClock.Elapsed.TotalSeconds, $catalog.count)
          }
          catch {
            Get-Content $standardOutputLog, $standardErrorLog -ErrorAction SilentlyContinue | Write-Host
            throw
          }
          finally {
            Stop-Process -Id $engineProcess.Id -Force -ErrorAction SilentlyContinue
          }
          $engineSizeMegabytes = (Get-ChildItem "engine-build/dist/maison-core" -Recurse -File |
            Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("Packaged engine size: {0:N0} MB" -f $engineSizeMegabytes)

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Build the installer with the bundled engine
        run: npm run tauri build -- --config src-tauri/tauri.engine.conf.json

      - name: Verify the engine is bundled
        run: |
          $bundledEngine = "src-tauri/target/release/maison-core/maison-core.exe"
          if (-not (Test-Path $bundledEngine)) {
            Get-ChildItem src-tauri/target/release -Depth 1 | Format-Table -AutoSize | Out-String | Write-Host
            throw "Bundled engine not found at $bundledEngine"
          }
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe |
            ForEach-Object { Write-Host ("Installer: {0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB)) }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: maison-terminal-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
